steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    script: |
        #!/usr/bin/env bash
        # Checking the environment variables
        if [ -z "${_MSNAME}" ]; then
          echo "Error: Environment variable _MSNAME is not set in the trigger.";
          exit 1;
        fi
        if [ -z "${_ENV}" ]; then
          echo "Error: Environment variable _ENV is not set in the trigger.";
          exit 1;
        fi
        if [ -z "${_REGION}" ]; then
          echo "Error: Environment variable _REGION is not set in the trigger.";
          exit 1;
        fi
        if [ -z "${_INSTANCE_CONNECTION_NAME}" ]; then
          echo "Error: Environment variable _INSTANCE_CONNECTION_NAME is not set in the trigger.";
          exit 1;
        fi
        if [ -z "${_B2C_DB_NAME}" ]; then
          echo "Error: Environment variable _B2C_DB_NAME is not set in the trigger.";
          exit 1;
        fi
        if [ -z "${_MS_SA_NAME}" ]; then
          echo "Error: Environment variable _MS_SA_NAME is not set in the trigger.";
          exit 1;
        fi
        if [ -z "${_VPC_NAME}" ]; then
          echo "Error: Environment variable _VPC_NAME is not set in the trigger.";
          exit 1;
        fi
        if [ -z "${_SUBNET_NAME}" ]; then
          echo "Error: Environment variable _SUBNET_NAME is not set in the trigger.";
          exit 1;
        fi
        if [ -z "${_EGRESS_SETTING}" ]; then
          echo "Error: Environment variable _EGRESS_SETTING is not set in the trigger.";
          exit 1;
        fi
       
        # Detect branch type
        if [[ "${BRANCH_NAME}" =~ ^release/ ]]; then
          export IS_RELEASE_BRANCH=true
          export IS_HOTFIX_BRANCH=false
        elif [[ "${BRANCH_NAME}" =~ ^hotfix/ ]]; then
          export IS_RELEASE_BRANCH=false
          export IS_HOTFIX_BRANCH=true
        else
          export IS_RELEASE_BRANCH=false
          export IS_HOTFIX_BRANCH=false
        fi

        # Build and push Docker image only for hotfix/* branches
        if [ "$IS_HOTFIX_BRANCH" = "true" ]; then

          ######
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          echo "ACCESS_TOKEN=${ACCESS_TOKEN}" > /workspace/token.env
          cat /workspace/token.env | cut -d '=' -f2 > /workspace/token1.txt
          export _ACCESS_TOKEN=$(cat /workspace/token1.txt) 
          ######

          ### Clone the validation rules repo from github ####
          echo "Cloning the validation rules repo from github...";

          GITHUB_TOKEN=$(gcloud secrets versions access latest --secret="space_cds-srt-github_token" --project="oa-apmena-spacecds-ap-qa") || {
            echo "Error: Failed to retrieve GitHub token from Secret Manager!"
            exit 1
          }

          # Configure Git to use the token for authentication
          git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

          # Clone the repository
          echo "Cloning the validation rules repository from GitHub..."
          git clone https://${GITHUB_TOKEN}@github.com/oa-nasapmena-crm/space-cds-b2c-validation-rules.git external/validation-rules || {
            echo "Error: Failed to clone the repository!"
            exit 1
          }

          # Fetch all tags
          echo "Fetching all tags from the repository..."
          cd external/validation-rules
          git fetch --tags || {
            echo "Error: Failed to fetch tags from the repository!"
            exit 1
          }

          # Get the latest tag
          latest_tag=$(git describe --tags `git rev-list --tags --max-count=1`) || {
            echo "Error: Failed to determine the latest tag!"
            exit 1
          }

          # Checkout the latest tag
          echo "Checking out the latest tag: $latest_tag..."
          git checkout $latest_tag || {
            echo "Error: Failed to checkout the latest tag ($latest_tag)!"
            exit 1
          }

          echo "========================="
          git status
          cd ../..
          ls -ltrh external/validation-rules
          echo "========================="   

          echo "Successfully checked out the latest tag: $latest_tag"

          #Build and push the docker image using docker executable
          echo "Building the Docker image...";
            
          # Build the Docker image locally
          docker build -t asia-southeast1-docker.pkg.dev/oa-apmena-spacecds-ap-dv/spacecds-docker/${_MSNAME}:$SHORT_SHA --build-arg ACCESS_TOKEN=$_ACCESS_TOKEN -f source_to_stage_load/Dockerfile .
          
          echo "Pushing the Docker image...";
          # Push the Docker image to Artifact Registry
          docker push asia-southeast1-docker.pkg.dev/oa-apmena-spacecds-ap-dv/spacecds-docker/${_MSNAME}:$SHORT_SHA

          echo "Docker image is pushed to the GAR";
          
          ######
        else
          echo "Skipping Docker build and push (not a hotfix/* branch)."
        fi

        if [ -f env.properties ]; then
          echo "Processing environment variables file..."
          tr '\n' ',' < env.properties | sed 's/,$//' > /workspace/env_vars.txt
        else
          echo "Warning: env.properties file not found!"
        fi

        echo "Deploying to Cloud Run with environment variables...";
        gcloud run deploy space-cds-etl-core \
            --image=asia-southeast1-docker.pkg.dev/oa-apmena-spacecds-ap-dv/spacecds-docker/${_MSNAME}:$SHORT_SHA \
            --region=${_REGION} \
            --add-cloudsql-instances=${_INSTANCE_CONNECTION_NAME} \
            --platform=managed \
            --set-env-vars="DB_NAME=${_B2C_DB_NAME}" \
            --set-env-vars="INSTANCE_CONNECTION_NAME=${_INSTANCE_CONNECTION_NAME}" \
            --set-env-vars="LOG_LEVEL=DEBUG" \
            --set-env-vars="ENV=${_ENV}" \
            --set-env-vars="TZ=UTC" \
            --set-env-vars="INSTANCE_IP=${_INSTANCE_IP}" \
            --set-env-vars="INSTANCE_PORT=${_INSTANCE_PORT}" \
            --set-env-vars="INPUT_BUCKET=${_INPUT_BUCKET}" \
            --set-env-vars="CONFIG_BUCKET=${_CONFIG_BUCKET}" \
            --set-env-vars="GCS_LOG_BUCKET=${_GCS_LOG_BUCKET}" \
            --set-env-vars="GCS_ERROR_BUCKET=${_GCS_ERROR_BUCKET}" \
            --set-env-vars="DB_MAPPING_BUCKET=${_DB_MAPPING_BUCKET}" \
            --set-env-vars="ARCHIVE_BUCKET=${_ARCHIVE_BUCKET}" \
            --memory=1024Mi \
            --service-account="${_MS_SA_NAME}" \
            --network="${_VPC_NAME}" \
            --subnet="${_SUBNET_NAME}" \
            --vpc-egress="${_EGRESS_SETTING}" \
            --set-secrets="DB_USER=space_cds-srt-cloudsql_b2c_user:latest,DB_CREDENTIAL=space_cds-srt-cloudsql_b2c_pwd:latest" \
            --allow-unauthenticated || {
              echo "Error: Cloud Run deployment failed!"
              exit 1
            }

        ####################
        
        # Tag the image with the branch/tag name for QA (only for hotfix/*)
        if [ "${_ENV}" = "qa" ]; then
          echo "Tagging image with branch name for QA";
          echo "$BRANCH_NAME" | tr '/' '-' > /workspace/release_tag_namepostdeploy.txt
          if [ -f /workspace/release_tag_namepostdeploy.txt ]; then
            RELEASE_TAG_NAME=$(cat /workspace/release_tag_namepostdeploy.txt)
            if [ -z "$RELEASE_TAG_NAME" ]; then
              echo "Error: release_tag_namepostdeploy.txt is empty."
              exit 1
            fi
          else
            echo "Error: release_tag_namepostdeploy.txt not found."
            exit 1
          fi
          IMAGE_TAG_NAME=$(cat /workspace/release_tag_namepostdeploy.txt)-$SHORT_SHA
          gcloud container images add-tag asia-southeast1-docker.pkg.dev/oa-apmena-spacecds-ap-dv/spacecds-docker/${_MSNAME}:$SHORT_SHA asia-southeast1-docker.pkg.dev/oa-apmena-spacecds-ap-dv/spacecds-docker/${_MSNAME}:$IMAGE_TAG_NAME --quiet
          echo "Image tagged as: asia-southeast1-docker.pkg.dev/oa-apmena-spacecds-ap-dv/spacecds-docker/${_MSNAME}:$IMAGE_TAG_NAME"
        else
          echo "Skipping image tagging (not release/* or not hotfix/* branch)."
        fi

options:
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
  dynamicSubstitutions: true
  pool:
    name: '${_WORKER_POOL}'