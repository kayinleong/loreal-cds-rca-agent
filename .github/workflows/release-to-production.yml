name: Release to Production

on:
  workflow_dispatch:
        
permissions:
  contents: read
  deployments: write
  
jobs:
  check-snow-tickets:
    uses: oa-nasapmena-engineering/github-workflows/.github/workflows/snow-release-checker.yml@main
    secrets:
      snow_agile_client_id: ${{ secrets.SNOW_AGILE_CLIENT_ID }}
      snow_agile_client_secret: ${{ secrets.SNOW_AGILE_CLIENT_SECRET }}
      snow_agile_scope: ${{ secrets.SNOW_AGILE_SCOPE }}
    with:
      approved_users: "XIU Henry, HUANG Marx, WONG Randall"
      required_tags: 'ETL'

  call-workflow:
    needs: check-snow-tickets
    uses: oa-nasapmena-engineering/github-workflows/.github/workflows/release-production.yml@main
    secrets:
      token: ${{ secrets.DEVOPS_TOKEN }}
