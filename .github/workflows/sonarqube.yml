name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - release/*
      - hotfix/*

  pull_request:
    branches:
      - main
      - release/*
      - hotfix/*

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Adjust Python version as needed

      - name: Run poetry image
        uses: oa-nasapmena-crm/actions-poetry@master 

      - uses: actions/cache@v3
        name: Define a cache for the virtual environment based on the dependencies lock file
        with:
          path: ./.venv
          key: venv-${{ hashFiles('poetry.lock') }}
        
      - name: Install dependencies
        run: |
          poetry install --no-root --with test

      - name: Run tests and generate coverage report
        run: |
          poetry run pytest --cov --cov-report=xml:coverage.xml

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        uses: SonarSource/sonarqube-scan-action@v4.2.1
        with:
          args: >
            -Dsonar.projectKey=nasapmena-crm-space-cds-etl-core
            -Dsonar.sources=$GITHUB_WORKSPACE/src
            -Dsonar.tests=$GITHUB_WORKSPACE/tests
            -Dsonar.language=py
            -Dsonar.python.coverage.reportPaths=$GITHUB_WORKSPACE/coverage.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.python.version=3.12