name: PR Description Checker

on:
  pull_request:
    types: [edited] # Trigger when a PR comment is created or edited

permissions:
    pull-requests: write
    contents: read
    issues: read

jobs:
  check_pr_description:
    name: Check PR Description
    uses: oa-nasapmena-engineering/github-workflows/.github/workflows/pr-template-checker.yml@main # Path to your reusable workflow
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
