# In your main project repository's .github/workflows/pr-checklist.yml

name: PR Checklist

on:
  pull_request:
    types: [opened, synchronize, reopened]
    
    
# cancel old edit events being processed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce_checklist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR Checklist Enforcer
        id: checklist_enforcer
        # This is how you reference an action in a separate repository
        uses: oa-nasapmena-engineering/actions-pr-checklist/@main # Or @v1, @v1.0.0, etc.
        with:
          preset: 'standard'
        env:
          GITHUB_TOKEN: "${{ secrets.DEVOPS_TOKEN }}"