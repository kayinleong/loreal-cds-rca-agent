name: Release to QA

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "To choose if the release/hotfix branch has not been created yet"
        required: false
        default: 'none'
        type: choice
        options:
          - "none"
          - "patch"
          - "minor"
          - "major"

jobs:
  call-workflow:
    uses: oa-nasapmena-engineering/github-workflows/.github/workflows/release-qa.yml@main
    with:
      version_type: ${{ github.event.inputs.version_type }}
    secrets:
      token: ${{ secrets.DEVOPS_TOKEN }}