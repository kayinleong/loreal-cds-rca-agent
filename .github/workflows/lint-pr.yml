name: 'Lint PR'
on:
  pull_request:
    types:
      - opened
      - synchronize
      
permissions:
  contents: read
  pull-requests: read

jobs:
  check-snow-tickets:
    uses: oa-nasapmena-engineering/github-workflows/.github/workflows/pr-snow-checker.yml@main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      snow_agile_client_id: ${{ secrets.SNOW_AGILE_CLIENT_ID }}
      snow_agile_client_secret: ${{ secrets.SNOW_AGILE_CLIENT_SECRET }}
      snow_agile_scope: ${{ secrets.SNOW_AGILE_SCOPE }}
    with:
      required_tags: 'ETL'

  lint-commit-message:
    uses: oa-nasapmena-engineering/github-workflows/.github/workflows/lint-commit-message.yml@main
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      