rename_fields:
  old_field: new_field

convert_case:
  uppercase_fields:
    - field1
  lowercase_fields:
    - field2

apply_type_conversions:
  int_field: int
  float_field: float

date_formats:
  date_field: "%Y-%m-%d"

concatenate_fields:
  new_field:
    fields:
      - field1
      - field2
    separator: "_"

set_default_values:
  default_field: "default_value"
