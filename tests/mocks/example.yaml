table_name: "project.dataset.table1"
operation: "insert"  # Can be "insert", "upsert" or "update"
primary_key: "id"  # Required for "update" operations
# file_delimiter: "|"
where_conditions:
  - field: "status"
    operator: "="
    value: "active"
  - field: "created_at"
    operator: ">"
    value: "2023-01-01"
field_mapping:
  firstName: first_name
  lastName: last_name
  dob: date_of_birth
  emailAddress: email
transformations:
  rename_fields:
    fullName: name
    dob: date_of_birth
  format:
    date_of_birth: "%Y-%m-%d"
  uppercase_fields: ["name"]
  lowercase_fields: ["email"]
  type_conversion:
    amount: "float"
  concat_fields:
    fullName:
      fields: ["firstName", "lastName"]
      separator: " "
  default_values:
    status: "active"

