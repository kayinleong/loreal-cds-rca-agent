main:
    params: [input]
    steps:
        - call_stage_load_wf:
            call: googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run
            args:
                workflow_id: spacecds-b2c-anz-aesop-migration-wkf-stage-load-<region_env>
                argument: ${input.p_stage}
            result: stg_wf_response
        - check_for_failed_task:
            switch:
                - condition : ${len(stg_wf_response.failed_tasks) == 0}
                  next : call_target_load_wf
                - condition : true
                  next : return_fail
        - call_target_load_wf:
            call: googleapis.workflowexecutions.v1.projects.locations.workflows.executions.run
            args:
                workflow_id: spacecds-b2c-anz-aesop-migration-wkf-target-load-<region_env>
                argument: ${input.p_target}
            result: tgt_wf_response
        - return_success:
            return: ${tgt_wf_response}
        - return_fail:
            return: ${stg_wf_response}