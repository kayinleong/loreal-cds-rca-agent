[tool.poetry]
name = "space_stage_target_etl"
version = "1.0.0"
description = ""
authors = ["CHU Xiu Qiang <XiuQiang.CHU+loreal@loreal.com>"]
readme = "README.md"
packages = [{ include = "space_stage_target_etl", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
pyyaml = "^6.0.2"
jsonschema = "^4.23.0"
pytz = "^2025.2"
apache-beam = {extras = ["gcp"], version = "^2.63.0"}
ruff = "^0.11.2"
cloud-sql-python-connector = {extras = ["pg8000"], version = "^1.18.0"}
google-cloud-secret-manager = "^2.23.2"
google-cloud-logging = "^3.10.0"
psycopg2-binary = "^2.9"
jsonref = "^1.1.0"
flask-wtf = "^1.2.2"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
pytest-cov = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.main]
load-plugins = "pylint_actions"

[tool.pytest.ini_options]
pythonpath = "src"