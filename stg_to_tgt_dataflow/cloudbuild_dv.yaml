steps:

  # Step 1: Build and push the docker image - push metadata.json to GCS - Create the Flex Template
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:519.0.0'
    script: |
        # Exit immediately if a command exits with a non-zero status
        set -e
        ls -lARt
        cd stg_to_tgt_dataflow
        echo "Building the Docker image...";

        # Build the Docker image locally
        docker build -t asia-southeast1-docker.pkg.dev/oa-apmena-spacecds-ap-dv/spacecds-docker/${_DATAFLOW_IMAGE_NAME}:$SHORT_SHA -f Dockerfile . || {
          echo "Error: Docker image build failed!";
          exit 1;
        }
        
        echo "Pushing the Docker image...";
        # Push the Docker image to Artifact Registry
        docker push asia-southeast1-docker.pkg.dev/oa-apmena-spacecds-ap-dv/spacecds-docker/${_DATAFLOW_IMAGE_NAME}:$SHORT_SHA || {
          echo "Error: Docker image push failed!";
          exit 1;
        }

        echo "Docker image is pushed to the GAR";

        # Push the Python files to Google Cloud Storage
        echo "Uploading metadata.json to Google Cloud Storage...";
        gsutil cp metadata.json gs://${_DATAFLOW_BUCKET_NAME}/dataflow-target-load/metadata.json || {
          echo "Error: Failed to upload metadata.json to GCS!";
          exit 1;
        }
        echo "File uploaded successfully.";

        # Create the Flex Template for the Dataflow pipeline
        echo "Creating the Flex Template for the Dataflow pipeline...";
        gcloud dataflow flex-template build gs://${_DATAFLOW_BUCKET_NAME}/dataflow-target-load/flex-template.json \
          --image=asia-southeast1-docker.pkg.dev/oa-apmena-spacecds-ap-dv/spacecds-docker/${_DATAFLOW_IMAGE_NAME}:$SHORT_SHA \
          --metadata-file=metadata.json \
          --sdk-language=PYTHON || {
          echo "Error: Failed to create the Flex Template!";
          exit 1;
        }
        echo "Flex Template created successfully.";


timeout: '1200s'

options:
  logging: CLOUD_LOGGING_ONLY
  automapSubstitutions: true
  dynamicSubstitutions: true
